alias: Vitodens - Neue Stoerung aufs Handy
description: Meldet eine aktive Sammelstoerung sofort und ergaenzt bekannte Fehlerdetails.
triggers:
  - trigger: state
    entity_id: sensor.vitodens_stoerung_aktuell
conditions:
  - condition: state
    entity_id: binary_sensor.vitodens_stoerung_aktiv
    state: "on"
actions:
  - action: notify.mobile_app_your_phone
    data:
      title: Stoerung an der Vitodens
      message: >-
        {{ state_attr('sensor.vitodens_stoerung_aktuell', 'beschreibung')
           or states('sensor.vitodens_stoerung_aktuell') }}.
        {% if state_attr('sensor.vitodens_stoerung_aktuell', 'code') not in [none, '', '--', '00'] %}
        Fehlercode: {{ state_attr('sensor.vitodens_stoerung_aktuell', 'code') }}.
        {% endif %}
        {% if state_attr('sensor.vitodens_stoerung_aktuell', 'zeitpunkt') %}
        Zeitpunkt der Heizung: {{ state_attr('sensor.vitodens_stoerung_aktuell', 'zeitpunkt') }}
        {% endif %}
      data:
        url: /vitodens-lokal/kontrolle
        clickAction: /vitodens-lokal/kontrolle
mode: queued
max: 10
